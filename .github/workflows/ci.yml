name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
jobs:
  # regtool unit tests (pytest), with GHDL, iverilog and verilator
  regtool_pytest:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/asylum-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends iverilog verilator
          pip3 install --break-system-packages -r tools/regtool/requirements_test.txt
          # sbi_pkg / pbi_pkg for the GHDL tests of the sbi and pbi interfaces
          git clone --depth 1 https://github.com/deuskane/asylum-utils-pkg.git /opt/asylum-utils-pkg

      - name: pytest
        env:
          ASYLUM_UTILS_PKG_DIR: /opt/asylum-utils-pkg/hdl
        run: python3 -m pytest tools/regtool -n auto

